<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuoteVerse | Daily Inspiration</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>

<header>
    <h1>🌿 QuoteVerse</h1>
    <p>
        One positive thought can change your entire day.
    </p>
</header>


<main class="container">

    <section id="quoteCard">

        <div class="overlay"></div>

        <article class="content">

            <p id="quote">
                "Loading Inspiration..."
            </p>

            <h3 id="author">
                
            </h3>

            <button id="favoriteBtn" aria-label="Add to favorites">
                🤍
            </button>

        </article>

    </section>


    <p id="counter">
        Quotes Viewed: 0
    </p>


    <div class="buttons">

        <button id="newQuoteBtn" type="button">
            ✨ Inspire Me
        </button>

        <button id="downloadBtn" type="button">
            📥 Download
        </button>

        <button id="shareBtn" type="button">
            📱 Share
        </button>

    </div>


</main>


<footer>
    © 2026 QuoteVerse | Created with ❤️
</footer>


<script src="script.js"></script>

</body>

</html>
